////////////////////////////////////////////////////////////////////////////////////////////
// This file is generated by NoResponse and any edits will be lost in generation updates.
//
// If you wish to customize this file then place those customizations in `build-extras.gradle` which 
// is not touched by generation updates.
//
// Additions to the plugins block can be made by setting the `additionalPlugins` property (an array 
// of string where each string value is an additional line in the block) in gen.yaml.
////////////////////////////////////////////////////////////////////////////////////////////


plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

compileJava.options.encoding = "UTF-8"
compileJava.options.compilerArgs += '-Xlint:unchecked'
compileTestJava.options.encoding = "UTF-8"

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

version = "${version}"
group = "${groupId}"

jar {
    dependsOn 'generatePomFileForMavenPublication'

    into("META-INF/maven/com.github.noresponsehq/java") {
        from(layout.buildDirectory.file("pom.xml")) {
            // Only include if it exists to avoid build ordering issues
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }
}

javadoc {
    options.encoding = "UTF-8"

    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Javadoc).configureEach {
  failOnError = false
  options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

sourcesJar {
    archiveBaseName = "${artifactId}"
}

javadocJar {
    archiveBaseName = "${artifactId}"
}

dependencies {
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.2'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.0'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    api 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    implementation 'com.jayway.jsonpath:json-path:2.10.0'
    api 'org.reactivestreams:reactive-streams:1.0.4'
}

ext {
    publishingConfig = [
        groupId: group,
        artifactId: artifactId,
        version: version,
        name: "NoResponse Java SDK",
        description: "SDK enabling Java developers to easily integrate with the NoResponse API.",
        publicationName: "maven"
    ]
}

apply from: 'publishing.gradle'

apply from: 'build-extras.gradle'